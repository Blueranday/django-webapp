{% extends 'base.html' %}
{% block titulo %}Tarea{% endblock %}
{% block contenido %}
<h2>{% if tarea %}Editar{% else %}Nueva{% endif %} tarea</h2>
<div class="tarjeta-formulario">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">Guardar</button>
    </form>
</div>
{% endblock %}

cat > templates/base.html << 'ARCHIVO_FIN'
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Gestor de Tareas{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-marino: #0F2A43;
            --azul-vivo: #1768C7;
            --azul-vivo-hover: #0F55A8;
            --celeste: #6FC6E8;
            --celeste-suave: #E7F4FA;
            --fondo: #F6FAFD;
            --superficie: #FFFFFF;
            --texto: #1A2332;
            --texto-suave: #5C6B7A;
            --borde: rgba(15, 42, 67, 0.10);
            --sombra: 0 4px 16px rgba(15, 42, 67, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.55;
        }
        h1, h2, h3 {
            font-family: 'Fraunces', Georgia, serif;
            color: var(--azul-marino);
            font-weight: 600;
            line-height: 1.25;
            margin: 0 0 0.5em;
        }
        h1 { font-size: 1.75rem; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.15rem; }
        p { color: var(--texto-suave); }
        a { color: var(--azul-vivo); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .encabezado {
            background: var(--azul-marino);
            padding: 1.1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .encabezado .marca {
            font-family: 'Fraunces', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #FFFFFF;
        }
        .encabezado nav a {
            color: #D9EAF7;
            margin-left: 1.4rem;
            font-size: 0.95rem;
        }
        .encabezado nav a:hover { color: #FFFFFF; }
        .encabezado form { display: inline; }
        .encabezado button.link-boton {
            background: none;
            border: none;
            color: #D9EAF7;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            margin-left: 1.4rem;
            padding: 0;
        }
        .encabezado button.link-boton:hover { color: #FFFFFF; text-decoration: underline; }
        main {
            max-width: 880px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }
        .boton {
            display: inline-block;
            background: var(--azul-vivo);
            color: #FFFFFF !important;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none !important;
            transition: background 0.15s ease;
        }
        .boton:hover { background: var(--azul-vivo-hover); }
        .boton-secundario {
            background: transparent;
            color: var(--azul-marino) !important;
            border: 1px solid var(--borde);
        }
        .boton-secundario:hover { background: var(--celeste-suave); }
        .enlace-discreto { color: var(--texto-suave); font-size: 0.9rem; }
        .grid-proyectos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.1rem;
            margin-top: 1.5rem;
            list-style: none;
            padding: 0;
        }
        .tarjeta-proyecto {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 1.3rem;
            transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }
        .tarjeta-proyecto:hover {
            border-color: var(--azul-vivo);
            box-shadow: var(--sombra);
            transform: translateY(-2px);
        }
        .tarjeta-proyecto h3 { margin-bottom: 0.3rem; }
        .tarjeta-proyecto h3 a { color: var(--azul-marino); }
        .tarjeta-proyecto .contador { color: var(--texto-suave); font-size: 0.85rem; }
        .estado-vacio {
            color: var(--texto-suave);
            border: 1px dashed var(--borde);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin-top: 1.5rem;
        }
        .lista-tareas { list-style: none; padding: 0; margin-top: 1rem; }
        .item-tarea {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-left: 4px solid var(--texto-suave);
            border-radius: 6px;
            padding: 0.9rem 1.1rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .item-tarea.pendiente { border-left-color: var(--texto-suave); }
        .item-tarea.en_progreso { border-left-color: var(--celeste); }
        .item-tarea.completada { border-left-color: var(--azul-vivo); }
        .item-tarea .titulo-tarea { font-weight: 500; }
        .item-tarea .meta-tarea { color: var(--texto-suave); font-size: 0.85rem; }
        .chip {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-weight: 500;
        }
        .chip.pendiente { background: #EEF1F4; color: var(--texto-suave); }
        .chip.en_progreso { background: var(--celeste-suave); color: #12688F; }
        .chip.completada { background: var(--azul-vivo); color: #FFFFFF; }
        .acciones-tarea a { font-size: 0.85rem; margin-left: 0.7rem; }
        .tarjeta-formulario {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 2rem;
            max-width: 480px;
            margin: 2rem auto 0;
        }
        form p { margin-bottom: 1rem; }
        form label {
            display: block;
            font-size: 0.9rem;
            color: var(--azul-marino);
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        form input, form textarea, form select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--borde);
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--fondo);
        }
        form input:focus, form textarea:focus, form select:focus {
            outline: none;
            border-color: var(--azul-vivo);
            box-shadow: 0 0 0 3px var(--celeste-suave);
        }
        form ul.errorlist {
            color: #B3413A;
            font-size: 0.85rem;
            list-style: none;
            padding: 0;
            margin: 0.2rem 0;
        }
        @media (max-width: 600px) {
            .encabezado { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
            main { padding: 1.5rem 1rem 3rem; }
        }
    </style>
</head>
<body>
    <header class="encabezado">
        <span class="marca">Gestor de Tareas</span>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'lista_proyectos' %}">Mis proyectos</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline">
                    {% csrf_token %}
                    <button type="submit" class="link-boton">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
                <a href="{% url 'registro' %}">Registrarse</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
